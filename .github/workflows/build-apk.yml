name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://gitpush.axeoncore.my.id' }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID || vars.VITE_GITHUB_CLIENT_ID }}
        run: npm run build

      - name: Add Capacitor Android & sync
        run: |
          npm install --no-save @capacitor/cli@^8 @capacitor/android@^8
          npx cap add android
          node scripts/setup-android-manifest.mjs
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-fast-push-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
